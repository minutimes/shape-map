name: CI

# Runs on every pull request and on every push to main. Branch pushes without a
# pull request are not repeated here; their pull request runs them.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  browser:
    name: Browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install headless Chromium and Korean fonts
        run: |
          npx playwright-core install --with-deps --only-shell chromium
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - run: npm run test:browser
      - name: Keep screenshots and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-check-results
          path: test-results/
          retention-days: 7
