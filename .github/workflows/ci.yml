name: CI

# PRs validate the integrated code once. Manual runs remain available for recovery.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Unit tests, build, and browser checks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, shape-map-mac]
    timeout-minutes: 20
    env:
      PLAYWRIGHT_SKIP_BROWSER_GC: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Install headless Chromium
        run: npx playwright-core install --only-shell chromium
      - run: npm run test:browser -- --skip-build
      - name: Keep screenshots and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-check-results
          path: test-results/
          retention-days: 7
